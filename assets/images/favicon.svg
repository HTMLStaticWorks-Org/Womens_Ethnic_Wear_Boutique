<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B2"/>
      <stop offset="28%" stop-color="#D4AF37"/>
      <stop offset="65%" stop-color="#AA8022"/>
      <stop offset="85%" stop-color="#E8CA72"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
    <linearGradient id="fav-gleam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E7CE82"/>
      <stop offset="50%" stop-color="#FFF3D1"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>
  <!-- Royal Oxblood Maroon background for high contrast on light/dark browser tabs -->
  <rect width="64" height="64" rx="14" fill="#1A0810"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="url(#fav-gold)" stroke-width="0.8" stroke-opacity="0.45"/>
  <!-- Outer 8-lobed lotus arch medallion -->
  <path d="M 24.0 12.6 C 26.1 6.4, 37.9 6.4, 40.0 12.6 C 45.9 9.7, 54.3 18.1, 51.4 24.0 C 57.6 26.1, 57.6 37.9, 51.4 40.0 C 54.3 45.9, 45.9 54.3, 40.0 51.4 C 37.9 57.6, 26.1 57.6, 24.0 51.4 C 18.1 54.3, 9.7 45.9, 12.6 40.0 C 6.4 37.9, 6.4 26.1, 12.6 24.0 C 9.7 18.1, 18.1 9.7, 24.0 12.6 Z" fill="none" stroke="url(#fav-gold)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Concentric inner rings -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="url(#fav-gold)" stroke-width="0.75" stroke-opacity="0.6"/>
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="url(#fav-gold)" stroke-width="0.8" stroke-dasharray="0.8 2.5" stroke-linecap="round"/>
  <!-- 4 cardinal jewel pearls -->
  <circle cx="32" cy="16.5" r="1.1" fill="url(#fav-gleam)"/>
  <circle cx="32" cy="47.5" r="1.1" fill="url(#fav-gleam)"/>
  <circle cx="16.5" cy="32" r="1.1" fill="url(#fav-gleam)"/>
  <circle cx="47.5" cy="32" r="1.1" fill="url(#fav-gleam)"/>
  <!-- Cormorant Serif Monogram 'Z' -->
  <path d="M 21.5 25.5 L 21.5 21.5 L 42.5 21.5 L 42.5 24.0 L 28.0 40.0 L 42.5 40.0 L 42.5 38.5 L 43.5 38.5 L 43.5 42.5 L 20.5 42.5 L 20.5 40.0 L 35.0 24.0 L 23.5 24.0 L 23.5 25.5 Z" fill="url(#fav-gold)"/>
  <!-- Center Kundan diamond star -->
  <polygon points="32,29.2 33.4,31.4 35.6,32 33.4,32.6 32,34.8 30.6,32.6 28.4,32 30.6,31.4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="32" cy="32" r="0.75" fill="url(#fav-gleam)"/>
</svg>